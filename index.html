<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WisataBot Tito – Asisten Perjalanan Indonesia</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --sand:   #F5EFE0;
      --terra:  #2d85c4;
      --teal:   #1A7A6E;
      --night:  #12211F;
      --mist:   #E8F4F2;
      --gold:   #E8A838;
      --text:   #1C2B29;
      --bubble-user: #2d7bc4;
      --bubble-bot:  #ffffff; 
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--night);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Background texture ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(196,98,45,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(26,122,110,.22) 0%, transparent 60%),
        repeating-linear-gradient(
          135deg,
          transparent 0px,
          transparent 40px,
          rgba(255,255,255,.015) 40px,
          rgba(255,255,255,.015) 41px
        );
      pointer-events: none; z-index: 0;
    }

    /* ── App shell ── */
    #app {
      position: relative; z-index: 1;
      width: min(480px, 96vw);
      height: min(780px, 96vh);
      background: var(--sand);
      border-radius: 28px;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    }

    /* ── Header ── */
    header {
      background: var(--teal);
      padding: 20px 22px 16px;
      display: flex; align-items: center; gap: 14px;
      flex-shrink: 0;
    }
    .avatar {
      width: 46px; height: 46px;
      background: var(--gold);
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }
    .header-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: #fff;
      line-height: 1.2;
    }
    .header-info p {
      font-size: .72rem;
      color: rgba(255,255,255,.65);
      margin-top: 2px;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #6EE7B7;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: .4; }
    }

    /* ── API key banner ── */
    #api-banner {
      background: linear-gradient(135deg, var(--terra), #a04520);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    #api-banner label { font-size: .75rem; color: #fff; white-space: nowrap; font-weight: 500; }
    #api-key-input {
      flex: 1;
      border: none; outline: none;
      background: rgba(255,255,255,.2);
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: .78rem;
      font-family: monospace;
    }
    #api-key-input::placeholder { color: rgba(255,255,255,.5); }
    #save-key-btn {
      background: var(--gold);
      border: none; border-radius: 8px;
      padding: 6px 12px;
      font-size: .75rem; font-weight: 600;
      cursor: pointer; color: var(--night);
      transition: opacity .2s;
    }
    #save-key-btn:hover { opacity: .85; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 4px; }

    /* ── Bubbles ── */
    .msg { display: flex; gap: 8px; animation: fadeUp .3s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user  { flex-direction: row-reverse; }
    .msg-icon  {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 14px; flex-shrink: 0;
      align-self: flex-end;
    }
    .msg.bot  .msg-icon { background: var(--teal); }
    .msg.user .msg-icon { background: var(--terra); }

    .bubble {
      max-width: 74%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: .86rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot  .bubble {
      background: var(--bubble-bot);
      border-bottom-left-radius: 4px;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .msg.user .bubble {
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    /* typing dots */
    .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: bounce .9s infinite; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    /* ── Quick chips ── */
    #chips {
      padding: 0 16px 10px;
      display: flex; gap: 7px; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .chip {
      background: #fff;
      border: 1.5px solid rgba(26,122,110,.3);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: .74rem;
      color: var(--teal);
      cursor: pointer;
      transition: background .2s, color .2s;
      font-weight: 500;
    }
    .chip:hover { background: var(--teal); color: #fff; }

    /* ── Input row ── */
    #input-row {
      padding: 12px 14px 16px;
      background: #fff;
      display: flex; gap: 10px; align-items: flex-end;
      border-top: 1px solid rgba(0,0,0,.06);
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      border: 1.5px solid rgba(0,0,0,.12);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: .86rem;
      font-family: 'DM Sans', sans-serif;
      resize: none; outline: none;
      max-height: 110px;
      line-height: 1.45;
      color: var(--text);
      transition: border-color .2s;
    }
    #user-input:focus { border-color: var(--teal); }
    #send-btn {
      width: 42px; height: 42px;
      background: var(--teal);
      border: none; border-radius: 12px;
      color: #fff; font-size: 18px;
      cursor: pointer; flex-shrink: 0;
      display: grid; place-items: center;
      transition: background .2s, transform .1s;
    }
    #send-btn:hover  { background: #155f55; }
    #send-btn:active { transform: scale(.92); }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <header>
    <div class="avatar">🧭</div>
    <div class="header-info">
      <h1>WisataBot Tito</h1>
      <p><span class="status-dot"></span>Asisten Perjalanan Indonesia</p>
    </div>
  </header>

  <!-- API Key Banner -->
  <div id="api-banner">
    <label>🔑 Gemini API Key</label>
    <input id="api-key-input" type="password" placeholder="Masukkan API key kamu..." autocomplete="off"/>
    <button id="save-key-btn">Simpan</button>
  </div>

  <!-- Chat -->
  <div id="chat"></div>

  <!-- Quick chips -->
  <div id="chips">
    <span class="chip" onclick="sendChip(this)">✈️ Destinasi Bali</span>
    <span class="chip" onclick="sendChip(this)">🏨 Hotel murah</span>
    <span class="chip" onclick="sendChip(this)">🗺️ Itinerary 3 hari</span>
    <span class="chip" onclick="sendChip(this)">💰 Budget traveling</span>
    <span class="chip" onclick="sendChip(this)">🍜 Kuliner lokal</span>
  </div>

  <!-- Input -->
  <div id="input-row">
    <textarea id="user-input" rows="1" placeholder="Tanya soal destinasi, hotel, itinerary..."></textarea>
    <button id="send-btn" title="Kirim">➤</button>
  </div>
</div>

<script>
  // ── State ──
  let apiKey = localStorage.getItem('gemini_key') || '';
  let history = [];

  const SYSTEM_PROMPT = `Kamu adalah WisataBot, asisten perjalanan cerdas khusus untuk destinasi wisata di Indonesia.
Kepribadianmu: ramah, antusias, informatif, dan selalu memberikan tips praktis.
Gunakan bahasa Indonesia yang santai dan mudah dipahami.
Fokus pada: rekomendasi destinasi, itinerary, hotel/penginapan, kuliner lokal, transportasi, budget traveling, dan tips keamanan.
Selalu akhiri dengan pertanyaan follow-up yang relevan untuk membantu pengguna merencanakan perjalanan yang lebih baik.
Gunakan emoji secukupnya agar terasa hidup. Format jawaban dengan rapi menggunakan baris baru.`;

  // ── Init ──
  if (apiKey) {
    document.getElementById('api-key-input').value = apiKey;
    addMessage('bot', '👋 Halo! Aku **WisataBot Tito**, asisten perjalanan Indonesia kamu.\n\nMau ke mana nih? Aku siap bantu rekomendasikan destinasi, buat itinerary, cari penginapan, atau info kuliner lokal! 🌴');
  } else {
    addMessage('bot', '🔑 Masukkan **Gemini API Key** kamu di atas dulu ya, biar kita bisa mulai petualangan!\n\nDapatkan API key gratis di: aistudio.google.com');
  }

  // ── API Key ──
  document.getElementById('save-key-btn').addEventListener('click', () => {
    const val = document.getElementById('api-key-input').value.trim();
    if (!val) return;
    apiKey = val;
    localStorage.setItem('gemini_key', val);
    addMessage('bot', '✅ API key tersimpan! Sekarang kita bisa mulai.\n\nHalo! Aku **WisataBot Tito**, asisten perjalanan Indonesia kamu.\n\nDestinasi wisata apa yang ingin kamu jelajahi hari ini?');
  });

  // ── Send ──
  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function sendChip(el) {
    document.getElementById('user-input').value = el.textContent.trim();
    sendMessage();
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;
    if (!apiKey) { addMessage('bot', '⚠️ Masukkan API key dulu ya!'); return; }

    input.value = '';
    input.style.height = 'auto';
    addMessage('user', text);
    history.push({ role: 'user', parts: [{ text }] });

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    const typingEl = addTyping();

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: history,
            generationConfig: { temperature: 0.8, maxOutputTokens: 1024 }
          })
        }
      );
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);

      const reply = data.candidates[0].content.parts[0].text;
      history.push({ role: 'model', parts: [{ text: reply }] });
      typingEl.remove();
      addMessage('bot', reply);
    } catch (err) {
      typingEl.remove();
      addMessage('bot', `❌ Error: ${err.message}\n\nCek API key kamu dan coba lagi.`);
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  // ── Helpers ──
  function addMessage(role, text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const icon = role === 'bot' ? '🧭' : '👤';
    div.innerHTML = `
      <div class="msg-icon">${icon}</div>
      <div class="bubble">${text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.innerHTML = `<div class="msg-icon">🧭</div><div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  // Auto-resize textarea
  document.getElementById('user-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
  });
</script>
</body>
</html>
